- name: Deploy Nginx Pod
  hosts: k8s
  tasks:
    - name: Deploy Nginx Pod
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: croma-pod
            namespace: default
          spec:
            containers:
              - name: cont-01
                image: ubuntu:latest
                ports:
                  - containerPort: 80
